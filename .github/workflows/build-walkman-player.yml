name: Build MuseWalk APK

on:
  push:
    branches: [walkman-player]
    paths:
      - "walkman-player/**"
      - ".github/workflows/build-walkman-player.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musewalk-a300-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: walkman-player
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Keep MuseWalk signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: musewalk-a300-signing-v1

      - name: Ensure stable MuseWalk development key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=MuseWalk Development,O=EGT GPT,C=JP"
          fi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build optimized release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuseWalk-A300-release-apk
          path: walkman-player/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
