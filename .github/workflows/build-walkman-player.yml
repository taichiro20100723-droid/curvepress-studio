name: Build MuseWalk APK

on:
  push:
    branches: [walkman-player]
    paths:
      - "walkman-player/**"
      - ".github/workflows/build-walkman-player.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: walkman-player
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuseWalk-debug-apk
          path: walkman-player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
